<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pedalera Web - Guitar FX</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #f0f0f0;
      --focus: #00ffcc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 15px;
      background: #0a0a0a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    h1 { font-size: 1.1rem; letter-spacing: 1px; }
    #power-btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #power-btn.active { background: #2a9d8f; }
    
    .instructions {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      padding: 8px;
      background: #161616;
    }

    .pedalboard {
      display: flex;
      gap: 15px;
      padding: 20px;
      overflow-x: auto;
      flex: 1;
      align-items: center;
      scroll-snap-type: x mandatory;
    }

    .pedal {
      min-width: 220px;
      height: 360px;
      background: var(--panel);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 3px solid #333;
      scroll-snap-align: center;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .pedal.selected {
      border-color: var(--focus);
      box-shadow: 0 0 18px rgba(0, 255, 204, 0.3);
      transform: translateY(-5px);
    }
    .pedal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pedal-title {
      font-weight: 800;
      font-size: 1.1rem;
      text-transform: uppercase;
    }
    .led {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #444;
      box-shadow: inset 0 0 4px #000;
    }
    .pedal.on .led {
      background: #ff2a2a;
      box-shadow: 0 0 12px #ff2a2a;
    }

    .pedal[data-fx="wah"] { background: linear-gradient(180deg, #2b2d42, #1a1b26); }
    .pedal[data-fx="drive"] { background: linear-gradient(180deg, #6a040f, #370617); }
    .pedal[data-fx="chorus"] { background: linear-gradient(180deg, #005f73, #001219); }
    .pedal[data-fx="psycho"] { background: linear-gradient(180deg, #5a189a, #240046); }
    .pedal[data-fx="delay"] { background: linear-gradient(180deg, #ca6702, #5f0f40); }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label { font-size: 0.75rem; text-transform: uppercase; color: #ccc; }
    input[type="range"] {
      width: 100%;
      accent-color: var(--focus);
      height: 24px;
    }

    .footswitch {
      background: #d9d9d9;
      color: #111;
      border: 4px solid #888;
      border-radius: 50%;
      width: 68px;
      height: 68px;
      margin: 0 auto;
      font-weight: bold;
      font-size: 0.7rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #555, 0 10px 15px rgba(0,0,0,0.6);
    }
    .footswitch:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>GUITAR FX RACK</h1>
    <button id="power-btn">ENCENDER AUDIO</button>
  </header>
  <div class="instructions">
    Móvil: Tocá el botón metálico | PC: Flechas ◄ ► para elegir, ESPACIO para activar
  </div>

  <div class="pedalboard" id="pedalboard">
    <!-- 1. GUAGUA (AUTO-WAH) -->
    <div class="pedal selected" data-fx="wah" data-index="0">
      <div class="pedal-header">
        <span class="pedal-title">Guagua</span>
        <div class="led"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Velocidad Barrido</label>
          <input type="range" id="wah-rate" min="0.5" max="8" step="0.1" value="2.5">
        </div>
        <div class="control-group">
          <label>Profundidad (Q)</label>
          <input type="range" id="wah-depth" min="2" max="15" step="0.5" value="8">
        </div>
      </div>
      <button class="footswitch" onclick="togglePedal(0)">PISAR</button>
    </div>

    <!-- 2. OVERDRIVE -->
    <div class="pedal" data-fx="drive" data-index="1">
      <div class="pedal-header">
        <span class="pedal-title">Overdrive</span>
        <div class="led"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Ganancia (Distorsión)</label>
          <input type="range" id="drive-gain" min="0" max="400" step="10" value="120">
        </div>
        <div class="control-group">
          <label>Volumen Salida</label>
          <input type="range" id="drive-level" min="0.1" max="1.5" step="0.05" value="0.7">
        </div>
      </div>
      <button class="footswitch" onclick="togglePedal(1)">PISAR</button>
    </div>
        <!-- 3. CHORUS -->
    <div class="pedal" data-fx="chorus" data-index="2">
      <div class="pedal-header">
        <span class="pedal-title">Chorus</span>
        <div class="led"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Velocidad (Rate)</label>
          <input type="range" id="chorus-rate" min="0.5" max="6" step="0.1" value="1.5">
        </div>
        <div class="control-group">
          <label>Mezcla</label>
          <input type="range" id="chorus-mix" min="0" max="1" step="0.05" value="0.5">
        </div>
      </div>
      <button class="footswitch" onclick="togglePedal(2)">PISAR</button>
    </div>

    <!-- 4. PSICODÉLICO (PHASER ESPACIAL) -->
    <div class="pedal" data-fx="psycho" data-index="3">
      <div class="pedal-header">
        <span class="pedal-title">Psicodélico</span>
        <div class="led"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Viaje (Oscilación)</label>
          <input type="range" id="psycho-rate" min="0.1" max="5" step="0.1" value="0.6">
        </div>
        <div class="control-group">
          <label>Resonancia Espacial</label>
          <input type="range" id="psycho-feedback" min="0.1" max="0.88" step="0.02" value="0.7">
        </div>
      </div>
      <button class="footswitch" onclick="togglePedal(3)">PISAR</button>
    </div>

    <!-- 5. DELAY -->
    <div class="pedal" data-fx="delay" data-index="4">
      <div class="pedal-header">
        <span class="pedal-title">Delay</span>
        <div class="led"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Tiempo (Segundos)</label>
          <input type="range" id="delay-time" min="0.05" max="1.0" step="0.05" value="0.35">
        </div>
        <div class="control-group">
          <label>Repeticiones (Feedback)</label>
          <input type="range" id="delay-feedback" min="0" max="0.85" step="0.05" value="0.45">
        </div>
      </div>
      <button class="footswitch" onclick="togglePedal(4)">PISAR</button>
    </div>
  </div>
  <script>
  let audioCtx;
  let isAudioRunning = false;
  let selectedIndex = 0;
  const pedalsDOM = document.querySelectorAll('.pedal');
  const pedalStates = [false, false, false, false, false];
  const nodes = {};

  document.getElementById('power-btn').addEventListener('click', async () => {
    if (!isAudioRunning) {
      await initAudio();
      document.getElementById('power-btn').textContent = 'AUDIO ACTIVO';
      document.getElementById('power-btn').classList.add('active');
      isAudioRunning = true;
    }
  });

  async function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({
      latencyHint: 'interactive'
    });

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        autoGainControl: false,
        noiseSuppression: false,
        latency: 0
      }
    });

    const input = audioCtx.createMediaStreamSource(stream);

    // 1. WAH
    nodes.wahDry = audioCtx.createGain();
    nodes.wahWet = audioCtx.createGain();
    nodes.wahFilter = audioCtx.createBiquadFilter();
    nodes.wahFilter.type = 'bandpass';
    nodes.wahFilter.frequency.value = 800;
    nodes.wahFilter.Q.value = 8;
    const wahLFO = audioCtx.createOscillator();
    const wahLFOGain = audioCtx.createGain();
    wahLFO.frequency.value = 2.5;
    wahLFOGain.gain.value = 600;
    wahLFO.connect(wahLFOGain);
    wahLFOGain.connect(nodes.wahFilter.frequency);
    wahLFO.start();
    nodes.wahLFO = wahLFO;
    nodes.wahDry.gain.value = 1;
    nodes.wahWet.gain.value = 0;

    // 2. DRIVE
    nodes.driveDry = audioCtx.createGain();
    nodes.driveWet = audioCtx.createGain();
    nodes.shaper = audioCtx.createWaveShaper();
    nodes.driveOut = audioCtx.createGain();
    nodes.shaper.curve = makeDistortionCurve(120);
    nodes.shaper.oversample = '4x';
    nodes.driveOut.gain.value = 0.7;
    nodes.driveDry.gain.value = 1;
    nodes.driveWet.gain.value = 0;

    // 3. CHORUS
    nodes.chorusDry = audioCtx.createGain();
    nodes.chorusWet = audioCtx.createGain();
    const chorusDelay = audioCtx.createDelay();
    chorusDelay.delayTime.value = 0.025;
    const chorusLFO = audioCtx.createOscillator();
    const chorusLFOGain = audioCtx.createGain();
    chorusLFO.frequency.value = 1.5;
    chorusLFOGain.gain.value = 0.004;
    chorusLFO.connect(chorusLFOGain);
    chorusLFOGain.connect(chorusDelay.delayTime);
    chorusLFO.start();
    nodes.chorusLFO = chorusLFO;
    nodes.chorusWetLevel = 0.5;
    nodes.chorusDry.gain.value = 1;
    nodes.chorusWet.gain.value = 0;

    // 4. PSICODÉLICO
    nodes.psychoDry = audioCtx.createGain();
    nodes.psychoWet = audioCtx.createGain();
    const allpass1 = audioCtx.createBiquadFilter();
    const allpass2 = audioCtx.createBiquadFilter();
    allpass1.type = 'allpass';
    allpass2.type = 'allpass';
    const psychoFeedback = audioCtx.createGain();
    psychoFeedback.gain.value = 0.7;
    const psychoLFO = audioCtx.createOscillator();
    const psychoLFOGain = audioCtx.createGain();
    psychoLFO.frequency.value = 0.6;
    psychoLFOGain.gain.value = 1200;
    psychoLFO.connect(psychoLFOGain);
    psychoLFOGain.connect(allpass1.frequency);
    psychoLFOGain.connect(allpass2.frequency);
    psychoLFO.start();
    nodes.psychoLFO = psychoLFO;
    nodes.psychoFeedback = psychoFeedback;
    nodes.psychoDry.gain.value = 1;
    nodes.psychoWet.gain.value = 0;

    // 5. DELAY
    nodes.delayDry = audioCtx.createGain();
    nodes.delayWet = audioCtx.createGain();
    nodes.delayNode = audioCtx.createDelay(2.0);
    nodes.delayNode.delayTime.value = 0.35;
    nodes.delayFeedback = audioCtx.createGain();
    nodes.delayFeedback.gain.value = 0.45;
    nodes.delayDry.gain.value = 1;
    nodes.delayWet.gain.value = 0;
        // CONEXIÓN EN SERIE
    const stage1Out = audioCtx.createGain();
    input.connect(nodes.wahDry).connect(stage1Out);
    input.connect(nodes.wahFilter).connect(nodes.wahWet).connect(stage1Out);

    const stage2Out = audioCtx.createGain();
    stage1Out.connect(nodes.driveDry).connect(stage2Out);
    stage1Out.connect(nodes.shaper).connect(nodes.driveOut).connect(nodes.driveWet).connect(stage2Out);

    const stage3Out = audioCtx.createGain();
    stage2Out.connect(nodes.chorusDry).connect(stage3Out);
    stage2Out.connect(chorusDelay).connect(nodes.chorusWet).connect(stage3Out);

    const stage4Out = audioCtx.createGain();
    stage3Out.connect(nodes.psychoDry).connect(stage4Out);
    stage3Out.connect(allpass1).connect(allpass2);
    allpass2.connect(psychoFeedback).connect(allpass1);
    allpass2.connect(nodes.psychoWet).connect(stage4Out);

    stage4Out.connect(nodes.delayDry).connect(audioCtx.destination);
    stage4Out.connect(nodes.delayNode);
    nodes.delayNode.connect(nodes.delayFeedback).connect(nodes.delayNode);
    nodes.delayNode.connect(nodes.delayWet).connect(audioCtx.destination);

    bindSliders();
  }

  function makeDistortionCurve(amount) {
    const k = typeof amount === 'number' ? amount : 50;
    const n_samples = 44100;
    const curve = new Float32Array(n_samples);
    const deg = Math.PI / 180;
    for (let i = 0; i < n_samples; ++i) {
      const x = (i * 2) / n_samples - 1;
      curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  function togglePedal(index) {
    selectedIndex = index;
    updateSelectionUI();
    pedalStates[index] = !pedalStates[index];
    const isOn = pedalStates[index];
    pedalsDOM[index].classList.toggle('on', isOn);
    if (!isAudioRunning) return;

    switch (index) {
      case 0:
        nodes.wahDry.gain.value = isOn ? 0.2 : 1;
        nodes.wahWet.gain.value = isOn ? 1.5 : 0;
        break;
      case 1:
        nodes.driveDry.gain.value = isOn ? 0 : 1;
        nodes.driveWet.gain.value = isOn ? 1 : 0;
        break;
      case 2:
        nodes.chorusWet.gain.value = isOn ? nodes.chorusWetLevel : 0;
        break;
      case 3:
        nodes.psychoDry.gain.value = isOn ? 0.6 : 1;
        nodes.psychoWet.gain.value = isOn ? 0.9 : 0;
        break;
      case 4:
        nodes.delayWet.gain.value = isOn ? 0.6 : 0;
        break;
    }
  }

  function bindSliders() {
    document.getElementById('wah-rate').oninput = e => nodes.wahLFO.frequency.value = e.target.value;
    document.getElementById('wah-depth').oninput = e => nodes.wahFilter.Q.value = e.target.value;
    document.getElementById('drive-gain').oninput = e => nodes.shaper.curve = makeDistortionCurve(Number(e.target.value));
    document.getElementById('drive-level').oninput = e => nodes.driveOut.gain.value = e.target.value;
    document.getElementById('chorus-rate').oninput = e => nodes.chorusLFO.frequency.value = e.target.value;
    document.getElementById('chorus-mix').oninput = e => {
      nodes.chorusWetLevel = Number(e.target.value);
      if (pedalStates[2]) nodes.chorusWet.gain.value = nodes.chorusWetLevel;
    };
    document.getElementById('psycho-rate').oninput = e => nodes.psychoLFO.frequency.value = e.target.value;
    document.getElementById('psycho-feedback').oninput = e => nodes.psychoFeedback.gain.value = e.target.value;
    document.getElementById('delay-time').oninput = e => nodes.delayNode.delayTime.value = e.target.value;
    document.getElementById('delay-feedback').oninput = e => nodes.delayFeedback.gain.value = e.target.value;
  }

  function updateSelectionUI() {
    pedalsDOM.forEach((p, idx) => {
      p.classList.toggle('selected', idx === selectedIndex);
    });
    pedalsDOM[selectedIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowRight') {
      e.preventDefault();
      selectedIndex = (selectedIndex + 1) % pedalsDOM.length;
      updateSelectionUI();
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      selectedIndex = (selectedIndex - 1 + pedalsDOM.length) % pedalsDOM.length;
      updateSelectionUI();
    } else if (e.code === 'Space') {
      e.preventDefault();
      togglePedal(selectedIndex);
    }
  });
</script>
</body>
</html>
